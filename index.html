    <link rel="stylesheet" href="assets/css/extra.css" />

  <body class="theme-dark">
    <!-- Clean, minimal visualizer mount root -->
    <div class="graphtool">
      <noscript>Turn on Javascript to use the graph tool</noscript>

    <!-- Core Libraries -->
    <script src="assets/js/d3.v5.min.js"></script>
    <script src="assets/js/d3-selection-multi.v1.min.js"></script>
    <script src="assets/js/fuse.min.js"></script>
    <script src="assets/js/reinvented-color-wheel.min.js"></script>

    <!-- App Configuration -->
    <script src="assets/js/config.js"></script>

    <!-- Visualizer & Component Modules -->
    <script src="assets/js/autoeq.js"></script>
    <script src="assets/js/tool_components/equalizer.js"></script>
    <script src="assets/js/tool_components/listAugment.js"></script>
    <script src="assets/js/tool_components/saveSvgAsPng.js"></script>
    <script src="assets/js/graphtool.js"></script>
    <script src="assets/js/tool_components/graphHeader.js"></script>

    <script src="assets/js/squigsites.js"></script>

    <!-- Optional Cross-Database Aggregator (controlled by graphAggregatorEnabled in config.js) -->
    <script>
      if (typeof graphAggregatorEnabled !== "undefined" && graphAggregatorEnabled) {
        var aggScript = document.createElement("script");
        aggScript.src = "https://graphaggregator.harutohiroki.com/graphAggregator.js";
        aggScript.defer = true;
        document.body.appendChild(aggScript);
      }
    </script>

    <!-- Audio Utilities -->
    <audio id="pinkNoiseAudio" preload="auto" loop>
      <source src="assets/audio/pinknoise.wav" type="audio/wav" />
    </audio>
    <audio id="scarletFIRE" preload="auto" loop>
